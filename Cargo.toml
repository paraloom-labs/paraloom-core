[workspace]
members = [
    "."
]
exclude = [
    "programs/paraloom",  # Separate build - has different Anchor/Solana version requirements
    "fuzz",               # cargo-fuzz crate; nightly-only, not part of the regular build
]
resolver = "2"

# Panic on arithmetic overflow in release, not silently wrap. The on-chain
# programs/paraloom crate already sets this; the off-chain node built with a plain
# `cargo build --release` otherwise used the default profile (overflow-checks off),
# so a future raw `+`/`-`/`*` that slipped past a checked_/saturating_ call would
# wrap in production instead of aborting. Defense-in-depth (#731). Tests already
# run with overflow-checks on (the dev-profile default), so nothing relies on
# wrapping.
[profile.release]
overflow-checks = true

[package]
name = "paraloom"
version = "0.6.0"
authors = ["Paraloom Team"]
edition = "2021"
license = "MIT"
description = "Privacy-focused Layer 2 on Solana with shielded pool and Groth16 zkSNARKs"

[lib]
name = "paraloom"
path = "src/lib.rs"

[[bin]]
name = "paraloom-node"
path = "src/bin/node.rs"

[[bin]]
name = "resource_test"
path = "src/bin/resource_test.rs"

[[bin]]
name = "node_test"
path = "src/bin/node_test.rs"

[[bin]]
name = "task-demo"
path = "src/bin/task_demo.rs"

[[bin]]
name = "submit-task"
path = "src/bin/submit_task.rs"

[[bin]]
name = "web-demo"
path = "src/bin/web_demo.rs"

[[bin]]
name = "benchmark-reqresp"
path = "src/bin/benchmark_reqresp.rs"

[[bin]]
name = "confidential-inference-worker"
path = "src/bin/confidential_inference_worker.rs"

[[bin]]
name = "bridge-init"
path = "src/bin/bridge_init.rs"

[[bin]]
name = "compute-demo"
path = "src/bin/compute_demo.rs"

[[bin]]
name = "setup_compute_ceremony"
path = "src/bin/setup_compute_ceremony.rs"

[[bin]]
name = "paraloom"
path = "src/bin/paraloom_cli.rs"

# Privacy/zkSNARK binaries
[[bin]]
name = "compute-poseidon-inputs"
path = "src/bin/compute_poseidon_inputs.rs"

[[bin]]
name = "verify-privacy"
path = "src/bin/verify_privacy.rs"

# Validator binaries
[[bin]]
name = "check-validators"
path = "src/bin/check_validators.rs"

[[bin]]
name = "init-validator-registry"
path = "src/bin/init_validator_registry.rs"

[[bin]]
name = "init-merkle-tree"
path = "src/bin/init_merkle_tree.rs"

[[bin]]
name = "demo-transact-v3"
path = "src/bin/demo_transact_v3.rs"

[[bin]]
name = "register-validator"
path = "src/bin/register_validator.rs"

[[bin]]
name = "reconcile-validators"
path = "src/bin/reconcile_validators.rs"

[[bin]]
name = "init-stake-token-vault"
path = "src/bin/init_stake_token_vault.rs"

[[bin]]
name = "migrate-bridge-state"
path = "src/bin/migrate_bridge_state.rs"

[[bin]]
name = "set-bridge-authority"
path = "src/bin/set_bridge_authority.rs"

[features]
default = ["solana-bridge"]
solana-bridge = ["solana-client", "solana-sdk", "solana-transaction-status", "solana-account-decoder", "borsh", "bs58"]

[dependencies]
# Core networking
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "gossipsub", "request-response", "macros", "kad", "ping", "relay", "dcutr", "autonat", "identify"] }
tokio = { version = "1.25.0", features = ["full"] }

# Web server - compatible versions
axum = "0.6"
tower-http = { version = "0.4", features = ["cors"] }

# Serialization & Data handling
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
bincode = "1.3.3"
base64 = "0.22.1" # decode Jupiter's base64 swapTransaction (#239)
# Verify the RS256 GCP Confidential Space attestation JWT (confidential inference).
# v10 no longer bundles a crypto backend by default (it panics at runtime asking
# for a CryptoProvider); `rust_crypto` selects the pure-Rust RSA/EC backend — no
# aws-lc-rs/ring C deps, which also keeps the worker portable to s390x (IBM SE).
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# HTTP client for the Jupiter v6 aggregator API (#239). rustls to match the
# TLS stack already pulled in by the Solana client deps (avoids OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Storage
rocksdb = "0.22"

# Logging & error handling
log = "0.4.33"
env_logger = "0.10.0"
thiserror = "1.0.38"
anyhow = "1.0.104"

# CLI 
clap = { version = "4.1.8", features = ["derive"] }
toml = "0.7.3"

# Utilities
futures = "0.3.26"
async-trait = "0.1.91"
once_cell = "1.21.4"
uuid = { version = "1.3", features = ["v4", "serde"] }
wat = "1.240" # For WASM parsing (compute demo)

# Cryptography
sha2 = "0.10"
hex = "0.4.3"
bs58 = { version = "0.5.1", optional = true }
rand = "0.8"
# NaCl crypto_box (X25519 + XSalsa20-Poly1305) for encrypted note delivery
# (#196). Wire-compatible with the wallet's tweetnacl `box`.
crypto_box = { version = "0.9.1", features = ["std"] }

# zkSNARK (arkworks ecosystem)
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
# FFT domains: the snarkjs-compatible QAP reduction and the phase-1 trapdoor
# demonstration both need them.
ark-poly = "0.4"
ark-snark = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "sponge"] }
# circomlib/circom-compatible fixed-width Poseidon (BN254 x5), pinned to the
# arkworks-0.4 line so its `Fr` matches ours. Its permutation + constants are
# the same ones the Solana `sol_poseidon` syscall implements, so an on-chain
# Merkle tree hashed via the syscall stays bit-identical to the circuit's hash
# (circuit v3, #350). Host hash + constant source for the in-circuit gadget.
light-poseidon = "0.2.0"
# On-chain Groth16 verification path (BN254 / alt_bn128). #249/#165.
solana-bn254 = "2.2"
num-bigint = "0.4"

# Solana dependencies (optional, enabled with solana-bridge feature)
# Using newer version to avoid dependency conflicts with arkworks
solana-client = { version = "2.0", optional = true }
solana-sdk = { version = "2.0", optional = true }
solana-transaction-status = { version = "2.0", optional = true }
solana-account-decoder = { version = "2.0", optional = true }
borsh = { version = "1.5", optional = true }

# WASM Runtime (Phase 3: Compute Layer)
wasmtime = "36.0"

# Other
sysinfo = "0.29.0"

[dev-dependencies]
tempfile = "3.3.0"
# `#[tokio::test(start_paused = true)]` in src/node/mod.rs needs tokio's
# `test-util` feature, which the `full` feature does not include. It used to
# arrive implicitly via tokio-test; declare it here so it is not load-bearing
# on an unrelated dependency.
tokio = { version = "1.25.0", features = ["test-util"] }
proptest = "1.11.0" # Property-based testing for privacy primitives (#71)
# Drive the axum routers directly in the health and ingress test modules:
# `tower::ServiceExt::oneshot` to call them, `hyper::body::to_bytes` to read
# the response back.
hyper = "0.14.32"
tower = "0.4"
# Rebuild the evaluation domain a Groth16 setup samples tau from, for the
# phase-1 trapdoor demonstration in src/ceremony/phase1_trapdoor.rs.
ark-poly = "0.4"
