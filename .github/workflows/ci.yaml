name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `mold` is significantly faster than the default `ld` for linking
# Rust binaries on Linux. Install via apt in each job that links
# (build, test*, coverage) and route the toolchain through it.
env:
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  format-and-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mold is required because the workflow-level RUSTFLAGS routes
      # all linking through it, including clippy's build-script links.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "paraloom-ci"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Nothing was checking the doc links. Circuit v3 deleted the withdrawal
      # and transfer consensus modules and left five references to them behind
      # in doc comments, alongside a dozen links into private items — all of
      # which rustdoc catches and nobody was asking it to.
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "paraloom-ci"

      # `--all-targets` compiles integration tests under `tests/` and
      # any examples in addition to the lib and bins. Catches dead
      # imports in test files that would otherwise drift silently
      # because `cargo test --lib` does not touch them. See #89.
      - name: Build all features (lib, bins, tests, examples)
        run: cargo build --all-features --all-targets

  test-quick:
    name: Quick Test (All Modules)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "paraloom-ci"

      # `--tests` covers the lib, the bins and the integration tests under
      # `tests/`. Those files were previously only compiled by the
      # `--all-targets` build above and never executed, so their assertions
      # could drift silently. Costs ~23s locally, nearly all of it in
      # tests/privacy_invariants.rs.
      - name: Run all tests (quick check)
        run: cargo test --tests --all-features

  consensus-network-e2e:
    name: Consensus Network E2E (libp2p)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "paraloom-ci"

      # The #181 Layer 2 test is `#[ignore]`'d — it binds loopback TCP and
      # depends on gossip-mesh timing — and needs no Solana validator, so it
      # runs here on a plain runner rather than in the bridge-e2e workflow
      # (which is path-filtered to the bridge sources). `--test-threads=1`
      # keeps the two nodes' fixed-lifetime ports and tasks from overlapping
      # with any future test in the same binary.
      # #226 relay reservation E2E. Also `#[ignore]`'d (binds loopback TCP,
      # depends on circuit-relay v2 reservation timing) and needs no Solana
      # validator, so it rides this same plain-runner job.
      - name: Run relay reservation E2E (ignored)
        run: cargo test --test relay_reservation_e2e --all-features -- --ignored --test-threads=1 --nocapture

      # #260 co-sign request-response E2E. Also `#[ignore]`'d (binds loopback
      # TCP, depends on connection timing) and needs no Solana validator, so it
      # rides this same plain-runner job.
      - name: Run co-sign protocol E2E (ignored)
        run: cargo test --test cosign_e2e --all-features -- --ignored --test-threads=1 --nocapture

      # #350 v3 transact settlement E2E: the transact twin of the above — two
      # validators verify a transact request over the mesh and the leader
      # assembles the multi-signature transact settlement. Same constraints.
      - name: Run transact settlement E2E (ignored)
        run: cargo test --test transact_cosign_e2e --all-features -- --ignored --test-threads=1 --nocapture

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-quick]
    if: false # Disabled due to RAM limitations on free runners
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --out Xml --lib --tests --timeout 300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
